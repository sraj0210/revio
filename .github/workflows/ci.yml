name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.29"
          enable-cache: true
      - name: Install Python
        run: uv python install 3.12
      - name: Sync locked dependencies
        run: uv sync --frozen --all-groups
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run pyright
      - name: Test
        run: uv run pytest
      - name: Validate empty database migration and revision
        run: |
          export REVIO_DATABASE_PATH="$RUNNER_TEMP/revio.db"
          uv run revio-db upgrade
          uv run revio-db check

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker compose build
      - name: Start healthy service
        run: docker compose up --detach --wait --wait-timeout 60
      - name: Verify health endpoint
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8000/health
          curl --fail --silent --show-error http://127.0.0.1:8000/ready
          docker compose exec -T worker /app/.venv/bin/revio-worker check-ready
      - name: Show service logs
        if: failure()
        run: docker compose logs
      - name: Stop service
        if: always()
        run: docker compose down --volumes
