services:
  migrate:
    build:
      context: .
    command: ["/app/.venv/bin/venaroq-db", "upgrade"]
    environment: &venaroq-environment
      VENAROQ_ENVIRONMENT: ${VENAROQ_ENVIRONMENT:-local}
      VENAROQ_DATABASE_PATH: /var/lib/venaroq/venaroq.db
      VENAROQ_GITHUB_ENABLED: ${VENAROQ_GITHUB_ENABLED:-false}
      VENAROQ_GITHUB_ALLOW_IDLE_WORKER: ${VENAROQ_GITHUB_ALLOW_IDLE_WORKER:-false}
      VENAROQ_GITHUB_WEBHOOK_MODE: ${VENAROQ_GITHUB_WEBHOOK_MODE:-disabled}
      VENAROQ_GITHUB_APP_ID: ${VENAROQ_GITHUB_APP_ID:-}
      VENAROQ_GITHUB_PRIVATE_KEY: ${VENAROQ_GITHUB_PRIVATE_KEY:-}
      VENAROQ_GITHUB_PRIVATE_KEY_FILE: ${VENAROQ_GITHUB_PRIVATE_KEY_FILE:-}
      VENAROQ_GITHUB_WEBHOOK_SECRET: ${VENAROQ_GITHUB_WEBHOOK_SECRET:-}
      VENAROQ_REVIEW_ENABLED: ${VENAROQ_REVIEW_ENABLED:-false}
      VENAROQ_REVIEW_PUBLISH_ENABLED: ${VENAROQ_REVIEW_PUBLISH_ENABLED:-false}
      VENAROQ_REVIEW_MODEL_ALIAS: ${VENAROQ_REVIEW_MODEL_ALIAS:-}
      VENAROQ_REVIEW_FALLBACK_ALIAS: ${VENAROQ_REVIEW_FALLBACK_ALIAS:-review-default}
      VENAROQ_REVIEW_ROLLOUT_REPOSITORIES: ${VENAROQ_REVIEW_ROLLOUT_REPOSITORIES:-}
      VENAROQ_REVIEW_ALLOW_REPOSITORY_OPTOUT: ${VENAROQ_REVIEW_ALLOW_REPOSITORY_OPTOUT:-false}
      VENAROQ_REVIEW_DRAFTS_ENABLED: ${VENAROQ_REVIEW_DRAFTS_ENABLED:-true}
      VENAROQ_REVIEW_PROTECTED_EXCLUSIONS: ${VENAROQ_REVIEW_PROTECTED_EXCLUSIONS:-}
      VENAROQ_REVIEW_AGENT_MODE_ENABLED: ${VENAROQ_REVIEW_AGENT_MODE_ENABLED:-false}
      VENAROQ_ANTHROPIC_ENABLED: ${VENAROQ_ANTHROPIC_ENABLED:-false}
      VENAROQ_ANTHROPIC_API_KEY: ${VENAROQ_ANTHROPIC_API_KEY:-}
      VENAROQ_ANTHROPIC_API_KEY_FILE: ${VENAROQ_ANTHROPIC_API_KEY_FILE:-}
      VENAROQ_OPENAI_ENABLED: ${VENAROQ_OPENAI_ENABLED:-false}
      VENAROQ_OPENAI_API_KEY: ${VENAROQ_OPENAI_API_KEY:-}
      VENAROQ_OPENAI_API_KEY_FILE: ${VENAROQ_OPENAI_API_KEY_FILE:-}
      VENAROQ_PUBLISH_MARKER_KEY: ${VENAROQ_PUBLISH_MARKER_KEY:-}
      VENAROQ_PUBLISH_MARKER_KEY_FILE: ${VENAROQ_PUBLISH_MARKER_KEY_FILE:-}
      VENAROQ_LOG_LEVEL: ${VENAROQ_LOG_LEVEL:-info}
      VENAROQ_LOG_FORMAT: ${VENAROQ_LOG_FORMAT:-json}
      VENAROQ_METRICS_BIND: ${VENAROQ_METRICS_BIND:-}
      VENAROQ_METRICS_PORT: ${VENAROQ_METRICS_PORT:-9090}
      VENAROQ_INGRESS_RATE_LIMIT: ${VENAROQ_INGRESS_RATE_LIMIT:-120}
      VENAROQ_INGRESS_RATE_WINDOW_SECONDS: ${VENAROQ_INGRESS_RATE_WINDOW_SECONDS:-60}
    volumes:
      - venaroq-data:/var/lib/venaroq
    restart: "no"

  api:
    build:
      context: .
    environment: *venaroq-environment
    ports:
      - "${VENAROQ_PORT:-8000}:8000"
    volumes:
      - venaroq-data:/var/lib/venaroq
    depends_on:
      migrate:
        condition: service_completed_successfully
    init: true
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - /app/.venv/bin/python
        - -c
        - "import json, urllib.request; r=urllib.request.urlopen('http://127.0.0.1:8000/ready',timeout=2); assert r.status==200; assert json.load(r)=={'status':'ready'}"
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  worker:
    build:
      context: .
    command: ["/app/.venv/bin/venaroq-worker", "run"]
    environment: *venaroq-environment
    volumes:
      - venaroq-data:/var/lib/venaroq
    depends_on:
      migrate:
        condition: service_completed_successfully
    init: true
    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 40s
    healthcheck:
      test: ["CMD", "/app/.venv/bin/venaroq-worker", "health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  venaroq-data:
